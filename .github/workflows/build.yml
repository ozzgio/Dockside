name: Build and self-check
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15-intel, macos-26]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Build universal app and run regression checks
        run: zsh build.sh
      - name: Verify both architectures and deployment targets
        run: |
          archs="$(lipo -archs build/Dockside.app/Contents/MacOS/Dockside)"
          [[ " $archs " == *" arm64 "* && " $archs " == *" x86_64 "* ]]
          codesign --verify --deep --strict build/Dockside.app
          xcrun vtool -show-build build/Dockside.app/Contents/MacOS/Dockside
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: macos-26
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: zsh build.sh && zsh package.sh
      - name: Publish developer preview
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/Dockside-*-macOS.zip dist/Dockside-*-source.zip dist/SHA256SUMS.txt --prerelease --title "Dockside $GITHUB_REF_NAME — developer preview" --notes-file distribution/release-notes.md
